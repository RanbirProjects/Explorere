<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insight Snapshot | Precision Professional Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #003b44;
      --accent: #d4a373;
      --bg: #01080a; /* Deep charcoal background */
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg);
    }

    body {
      font-family: 'Inter', sans-serif;
      color: #f8fafc;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
    }

    .serif { font-family: 'Playfair Display', serif; }
    
    /* Cinematic Neural Mesh Background */
    .neural-mesh {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: -10;
      background: 
        radial-gradient(circle at 20% 30%, rgba(0, 59, 68, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(212, 163, 115, 0.1) 0%, transparent 50%),
        var(--bg);
      pointer-events: none;
    }

    .neural-mesh::after {
      content: "";
      position: absolute;
      inset: 0;
      background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
      opacity: 0.1;
      mix-blend-mode: overlay;
    }

    .grain {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1000;
      pointer-events: none;
      opacity: 0.03;
      background-image: url("https://www.transparenttextures.com/patterns/asfalt-dark.png");
    }

    .glass-nav {
      background: rgba(1, 8, 10, 0.8);
      backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--glass-border);
    }

    /* Cinematic Reveal Animations */
    .reveal {
      animation: revealContent 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }
    @keyframes revealContent {
      from { opacity: 0; transform: translateY(50px) scale(0.97); filter: blur(15px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    .stagger-1 { animation-delay: 0.15s; }
    .stagger-2 { animation-delay: 0.3s; }
    .stagger-3 { animation-delay: 0.45s; }

    .hover-card {
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid var(--glass-border);
      background: var(--glass);
    }
    .hover-card:hover {
      transform: translateY(-10px) scale(1.01);
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--accent);
      box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.5);
    }

    .glowing-button {
      position: relative;
      overflow: hidden;
      transition: all 0.4s ease;
    }
    .glowing-button::after {
      content: "";
      position: absolute;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(212, 163, 115, 0.2) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    .glowing-button:hover::after {
      opacity: 1;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #fff; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@^19.2.4",
      "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
      "react/": "https://esm.sh/react@^19.2.4/",
      "@google/genai": "https://esm.sh/@google/genai@^1.40.0"
    }
  }
  </script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="antialiased">
  <div class="neural-mesh"></div>
  <div class="grain"></div>
  <div id="root"></div>

</body>
</html>
